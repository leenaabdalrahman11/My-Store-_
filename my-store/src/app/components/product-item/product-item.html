<mat-card class="product-card">
  <div
    class="image-wrapper"
    role="button"
    tabindex="0"
    (click)="goToDetails()"
    (keydown.enter)="goToDetails()">

    <img
      [src]="product.url || 'https://placehold.co/300x300'"
      [alt]="product.name"
      class="product-image">
  </div>

  <mat-card-content class="product-content">
    <div class="title-row">
      <h3>
        <button
          type="button"
          class="product-title-button"
          (click)="goToDetails()">
          {{ product.name }}
        </button>
      </h3>

      <span class="price">
        ${{ product.price }}
      </span>
    </div>

    <p class="description">
      {{ product.description || 'No description available.' }}
    </p>
  </mat-card-content>

  <mat-card-actions class="card-actions">
    <div class="quantity-control">
      <button
        class="quantity-btn"
        type="button"
        (click)="decreaseQuantity()">
        −
      </button>

      <span class="quantity">
        {{ product.quantity || 1 }}
      </span>

      <button
        class="quantity-btn"
        type="button"
        (click)="increaseQuantity()">
        +
      </button>
    </div>

    <button
      mat-flat-button
      color="primary"
      class="cart-button"
      type="button"
      (click)="addToCart()">
      Add to Cart
    </button>
  </mat-card-actions>
</mat-card>
