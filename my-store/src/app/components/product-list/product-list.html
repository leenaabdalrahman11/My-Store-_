<section class="hero-section">
  <img
    src="hero.jpg"
    alt="MyStore hero"
    class="hero-image">

  <div class="hero-overlay"></div>

  <div class="hero-text">
    <h1>Welcome to MyStore</h1>

    <p>
      Find your favorite products and shop with ease.
    </p>
  </div>
</section>

<section class="products-page" id="products">
  <div class="products-header">
    <h2>Featured Products</h2>
    <p>Choose your favorite products and add them to your cart.</p>
  </div>

<div class="empty-state" *ngIf="loading">
  <h3>Loading products...</h3>
  <p>Please wait.</p>
</div>

<div class="product-list" *ngIf="!loading && products.length > 0">
  <app-product-item
    *ngFor="let product of paginatedProducts"
    [product]="product"
    (addProduct)="addToCart($event)">
  </app-product-item>
</div>

<div class="empty-state" *ngIf="!loading && products.length === 0">
  <h3>No products found</h3>
  <p>Please check back later.</p>
</div>
<div class="pagination" *ngIf="!loading && products.length > 0">
  <button
    mat-stroked-button
    color="primary"
    (click)="previousPage()"
    [disabled]="currentPage === 1">
    Previous
  </button>

  <span>
    Page {{ currentPage }} of {{ totalPages }}
  </span>

  <button
    mat-stroked-button
    color="primary"
    (click)="nextPage()"
    [disabled]="currentPage === totalPages">
    Next
  </button>
</div>
</section>
